<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Attention Is Not All You Need</title>
  <desc id="desc">A restrained research banner showing dense model state, sparse features, interventions, and measured behavior.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122129"/>
      <stop offset="1" stop-color="#243942"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1180" cy="80" r="120" fill="#b5ced0" opacity="0.08" filter="url(#soft)"/>
  <circle cx="1260" cy="300" r="180" fill="#c9ac79" opacity="0.07" filter="url(#soft)"/>

  <g transform="translate(72 66)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="0" y="34" fill="#b5ced0" font-size="18" letter-spacing="5">MECHANISTIC INTERPRETABILITY</text>
    <text x="0" y="104" fill="#f2f3f0" font-size="58" font-weight="700">Attention Is Not All You Need</text>
    <text x="0" y="148" fill="#cbd7d8" font-size="24">Sparse features · causal interventions · lexical constraints · replication</text>

    <g transform="translate(0 205)">
      <rect x="0" y="0" width="220" height="72" rx="14" fill="#f2f3f0" opacity="0.08" stroke="#b5ced0" stroke-opacity="0.35"/>
      <text x="24" y="30" fill="#b5ced0" font-size="14" letter-spacing="2">ACTIVATION</text>
      <text x="24" y="54" fill="#f2f3f0" font-size="17">What fires?</text>

      <path d="M225 36 H286" stroke="#c9ac79" stroke-width="2"/>
      <path d="M278 28 L290 36 L278 44" fill="none" stroke="#c9ac79" stroke-width="2"/>

      <rect x="294" y="0" width="220" height="72" rx="14" fill="#f2f3f0" opacity="0.08" stroke="#b5ced0" stroke-opacity="0.35"/>
      <text x="318" y="30" fill="#b5ced0" font-size="14" letter-spacing="2">INTERVENTION</text>
      <text x="318" y="54" fill="#f2f3f0" font-size="17">What changes?</text>

      <path d="M519 36 H580" stroke="#c9ac79" stroke-width="2"/>
      <path d="M572 28 L584 36 L572 44" fill="none" stroke="#c9ac79" stroke-width="2"/>

      <rect x="588" y="0" width="220" height="72" rx="14" fill="#f2f3f0" opacity="0.08" stroke="#b5ced0" stroke-opacity="0.35"/>
      <text x="612" y="30" fill="#b5ced0" font-size="14" letter-spacing="2">MECHANISM</text>
      <text x="612" y="54" fill="#f2f3f0" font-size="17">Where does it act?</text>
    </g>
  </g>

  <g transform="translate(1035 165)" opacity="0.95">
    <path d="M0 50 C52 -10 110 110 170 42 C220 -13 258 16 300 76" fill="none" stroke="#b5ced0" stroke-width="3" opacity="0.75"/>
    <circle cx="42" cy="20" r="8" fill="#c9ac79"/>
    <circle cx="104" cy="83" r="8" fill="#b5ced0"/>
    <circle cx="170" cy="42" r="10" fill="#c9ac79"/>
    <circle cx="238" cy="20" r="7" fill="#b5ced0"/>
    <circle cx="292" cy="67" r="9" fill="#c9ac79"/>
    <text x="3" y="132" fill="#cbd7d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">association ≠ causation ≠ mechanism</text>
  </g>
</svg>

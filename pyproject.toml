[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-not-all"
version = "0.1.0"
description = "Dependency-light analysis and audit utilities for a causal sparse-feature interpretability study"
requires-python = ">=3.10"
authors = [{name = "Research project contributors"}]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
